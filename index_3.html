gic business units through which we undertake specific business activities.","These strategic business units are incorporated as subsidiary companies to provide diversity of investment held within a respected structure of governance framework.","Ultimately it enhances resource optimization and creates relative independence for each business activity while at the same time offering a unique convergence platform for the consummation of the synergies that arises from within."],history:"The National Trust Holding Company (NTHC) Limited was established in 1976 (under the auspices of the National Investment Bank) by incorporation under the Companies Code, 1963 (Act 179). In that same year, NTHC was authorized by Legislative Instrument (L.I 1093/76) to operate as a Mutual Fund.",mission:"To create and provide a reliable array of investment options that fulfils the appetite of varied investors leveraging research, innovation and professionalism at all times.",vision:"To be respected as the fore-runner in Investment Banking value creation and a model financial sector institution across Ghana and beyond.",stakeholders:["Our dedicated employees, with their diverse skills, expertise, and unwavering passion, have been the driving force behind our remarkable transaction history.","As a brand, we have had our unparalleled moments of glory as well as challenging times but in all of these circumstances, we have treasured the value our clients bring to the table, the commitment of our staff and the support of our shareholders."],pledge:"By an agile application of our core values, we are certain to remain relevant in the evolving business landscape and entreat our clients to continue trusting in our capabilities."},rh=[{letter:"E",name:"Excellence",text:"The quest to achieve excellence must be viewed as a continuous process and not an end. Employees must always seek to achieve excellence by offering superior service and making daily contributions that would promote excellence over the immediate to long-term."},{letter:"T",name:"Teamwork",text:"Creating a healthy environment that encourages team work and promotes cross-referencing among peers is perhaps a major step to driving innovation by enabling all personnel to develop a deep feeling of belonging. This would encourage the sharing of ideas and promote the radicalisation of new thinking to the benefit of the Company."},{letter:"I",name:"Integrity",text:"Remaining competitive requires high levels of integrity and ethical behaviour. This is critical to preserve the Company\u2019s trade secrets, remain competitive and attain leadership position."},{letter:"R",name:"Responsibility",text:"Embracing the opportunity to contribute towards the achievement of the objectives of the company and accepting that their actions impact everyone around them."},{letter:"I",name:"Innovation",text:"Innovation must be viewed as the most critical independent resource required of NTHC\u2019s human capital to operate and to achieve its vision. Focusing on the opportunities in the industry and being ahead of competitors to introduce new ideas/products in the industry."}],Vu=[{name:"Social Security and National Insurance Trust (SSNIT)",share:75,text:"Established in 1972, SSNIT is a statutory public Trust charged under the National Pensions Act 2008 (Act 766) with the administration of Ghana\u2019s Basic National Social Security Pension Scheme, catering for the first tier of the contributory three-tier scheme. Today it manages one of the largest asset portfolios in Ghana."},{name:"National Investment Bank (NIB)",share:8.71,text:"Incorporated in 1963 as an autonomous joint state-private institution primarily to promote and strengthen rapid industrialization in all sectors of the Ghanaian economy. Today it is one of the oldest established banks in the country."},{name:"State Insurance Company Limited (SIC)",share:8.71,text:"SIC traces its roots to 1955. It is the nation\u2019s largest insurer and the only one with a nationw
